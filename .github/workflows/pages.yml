# Testet die Seite und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mathe-Tests und Inhalts-Lint
        run: npm test
      - name: Alle Lektionen im Browser rendern (KaTeX- und Konsolenfehler)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/check-pages.mjs --no-screens
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css src vendor _site/
          find _site -name '*.test.js' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
